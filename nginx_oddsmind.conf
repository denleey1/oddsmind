# 自定义日志格式，包含响应时间
log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name oddsmind.top www.oddsmind.top;

    # 日志配置（使用详细格式）
    access_log /var/log/nginx/oddsmind_access.log detailed;
    error_log /var/log/nginx/oddsmind_error.log;

    # 客户端最大上传大小
    client_max_body_size 10M;

    # 静态文件服务
    location /static/ {
        alias /home/ubuntu/oddsmind/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 产品说明和使用指南
    location /guide/ {
        alias /home/ubuntu/oddsmind/training/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 反向代理到Flask应用
    location / {
        proxy_pass http://127.0.0.1:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://127.0.0.1:8889/health;
        proxy_set_header Host $host;
        access_log off;
    }
}


